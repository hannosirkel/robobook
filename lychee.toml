# Link checking for this repository.
#
# Internal links are checked strictly. External links are checked except where
# an anonymous checker cannot get a meaningful answer.

exclude_path = [
  # Symlink mirrors of skills/ for two other agent harnesses. Without this every
  # link in skills/ is fetched three times.
  ".claude",
  ".opencode",
]

exclude = [
  # Five repositories in this universe are private. An anonymous checker gets
  # 404 for a private repository that exists, which is a false failure rather
  # than a finding. Narrow to exactly those five: every other link, including
  # every public GitHub link, is checked for real.
  "^https://github\\.com/hannosirkel/(architecture|orange|orange-inventory|myskills|entpass)(/|$)",
]

# GitHub rate-limits anonymous requests hard enough to make a run flaky.
max_concurrency = 4
max_retries = 2
timeout = 20

accept = ["200", "204", "206", "429"]
